services:
  - type: web
    name: video-generator
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:deploy && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: VIDEO_PROVIDER_MOCK
        value: "false"
      - key: VIDEO_PROVIDER_BASE_URL
        value: https://api.loova.ai/api
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: video-generator
      - key: AUTH_SECRET
        generateValue: true
      - key: SETUP_SECRET
        sync: false
      - key: KEY_ENCRYPTION_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: video-generator-db
          property: connectionString

databases:
  - name: video-generator-db
    plan: free
